<div class="app-layout">

  <!-- Sidebar -->
  <app-sidebar-menu
    [isOpen]="sidebarOpen">
  </app-sidebar-menu>

  <!-- Content -->
  <div
    class="app-content"
    [class.sidebar-open]="sidebarOpen"
  >

    <!-- Navbar -->
    <app-navbar
      (sidebarToggle)="toggleSidebar()">
    </app-navbar>

    <!-- Page Content -->
    <main class="p-3">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
